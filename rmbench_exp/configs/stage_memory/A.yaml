# Stage-memory experiment (docs/STAGE_MEMORY.md), group A: original LiLa-WAM, swap_blocks only.
# F and M inherit this file, so the three groups differ ONLY in model.stage_memory.
_base_: ../base.yaml
experiment:
  name: sm_A
  seed: 0
rmbench:
  tasks: [swap_blocks]
  holdout_per_task: 5               # 45 training / 5 held-out demos (plan section 3)
paths:
  norm_stats: artifacts/stage_memory/swap_blocks/stats.json      # recomputed on the 45 demos (step 4)
dataset:
  task_cond_dir: artifacts/stage_memory/swap_blocks/vtt           # recomputed on the 45 demos (step 5)
  # (single task: the VTT token is the same vector in every sample; kept so the warm start loads strictly)
  stage_memory:
    boundaries: artifacts/stage_memory/swap_blocks/boundaries_gt.json
    cls_dir: artifacts/stage_memory/swap_blocks/cls
    jitter_p: 0.5                   # move each boundary by +-1 chunk with prob 0.5 (training only)
model:
  variant: lila_wam
  stage_memory:
    enabled: false
training:
  # The RoboTwin model was trained in ONE stage (no --init_from run): 2e-4 -> 5e-5 cosine, batch 64.
  # Fine-tuning from it here (same for A, F, M):
  # - lr 1e-4 -> 1e-5 cosine with 200 warm-up steps: half the pre-training peak, because the
  #   action model is already trained; the new memory parameters start from zero output.
  # - 8,000 steps x batch 64 ~ 18 passes over the ~27.7k swap_blocks samples, about the same
  #   number of passes each task's data got in the first-round multi-task run (~17.4).
  #   The log prints the exact epoch count at start.
  learning_rate: 1.0e-4
  lr_min: 1.0e-5
  warmup_steps: 200
  total_steps: 8000
  batch_size: 64
  grad_accum_steps: 1
  save_every_steps: 1000            # 8 checkpoints; the final one is chosen on held-out stage-4 L_fm
