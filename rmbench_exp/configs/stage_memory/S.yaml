# Stage-memory phase 3, option A: the model learns WHEN to switch (rmbench_lila/learned_switch.py).
# Same data, memory, warm start and learning rate as M; NO boundaries anywhere (no stage_memory
# feature, boundaries: null). Only the number of switches per demo (3 = num_slots) is a prior.
_base_: A.yaml
experiment:
  name: sm_S
dataset:
  features: [state, action_chunk, image, future_image, task_cond]
  stage_memory:
    boundaries: null                # not used: the model finds the switches itself
    cls_dir: artifacts/stage_memory/swap_blocks/cls      # frame CLS (memory content, as in M)
model:
  variant: lila_wam_learned_switch
  stage_memory:
    enabled: true
    mode: stage
    num_slots: 3
  learned_switch:
    episodes_per_step: 8            # whole demos per optimizer step (~37 chunks each, ~300 samples)
    total_steps: 1500               # x ~300 samples ~ 450k samples (M: 8000 x 64 = 512k)
    warmup_steps: 100
    lambda_count: 1.0               # ((sum_c p_c - 3) / 3)^2 per demo
    prior_rate: 0.08                # initial P(switch) per chunk ~ 3 / 37
    save_every: 250
    log_every: 10
